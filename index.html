<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RespiraFocus</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <h1 class="title">#RespiraFocus</h1>
    <div class="breathing-circle">
        <span id="breath-text">Inspire</span>
    </div>
</body>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        font-family: 'Raleway', sans-serif;
    }

    .title {
        font-size: 2rem;
        margin-bottom: 20px;
        top: 10%;
        position: absolute;
    }

    .breathing-circle {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-color: #4CAF50;
        animation: breathe 14s infinite;

        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #breath-text {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
    }

    @keyframes breathe {
        0% {
            transform: scale(1);
            /* Início */
        }

        28.57% {
            transform: scale(1.3);
            /* Após 4s - Inspiração completa */
            background-color: rgb(64, 138, 228);

        }

        57.14% {
            transform: scale(1.3);
            /* Após 4s de segurar - mantido */
            background-color: rgb(64, 138, 228);

        }

        100% {
            transform: scale(1);
            /* Após 6s de expiração - volta ao normal */
        }
    }
</style>

<script>
    const text = document.getElementById('breath-text');

    function updateBreathText() {
        // Fases: 0s = inspire, 4s = hold, 8s = expire
        text.textContent = 'Inspire';
        setTimeout(() => {
            text.textContent = 'Segure';
        }, 4000);
        setTimeout(() => {
            text.textContent = 'Expire';
        }, 8000);
    }

    updateBreathText();
    setInterval(updateBreathText, 14000); // repetir a cada 14s
</script>

</html>
